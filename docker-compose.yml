services:
    redis:
        image: redis:7-alpine
        container_name: hypixel_achievements_redis
        restart: unless-stopped
        command:
            - redis-server
            - --appendonly
            - "yes"
            - --maxmemory-policy
            - allkeys-lru
        volumes:
            - redis-data:/data
        networks:
            - proxy
    app:
        build: .
        image: hypixel-achievements:current
        container_name: hypixel_achievements_app
        restart: unless-stopped
        env_file:
            - .env.docker
        environment:
            - REDIS_URL=redis://redis:6379
        depends_on:
            - redis
        labels:
            - "traefik.enable=true"
            - "traefik.docker.network=proxy"
            - "traefik.http.routers.hypixel.rule=Host(`aphunt.aymvn.net`)"
            - "traefik.http.routers.hypixel.entrypoints=web"
            - "traefik.http.services.hypixel.loadbalancer.server.port=3000"
        networks:
            - proxy

volumes:
    redis-data:

networks:
    proxy:
        external: true
        name: proxy
